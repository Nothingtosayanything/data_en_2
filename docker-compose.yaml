# Предварительная сборка образова (при необходимости)
# docker buildx build --target jupyter   -t de-practice-7/jupyter:latest .
# docker buildx build --target ubuntu-vm -t de-practice-7/ubuntu-vm:latest .

# Запуск всех контейнеров
# docker compose up -d   # compose увидит уже собранные образы и не будет пересобирать

name: de-practice-7

# Jar'ы, которые jar-downloader скачает при первом запуске
# в ./jars на хосте (повторно не качаются — проверка по имени файла)
x-jars: &jar-list
  JARS: >-
    postgresql-42.7.3.jar|org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
    hadoop-aws-3.3.4.jar|org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar
    aws-java-sdk-bundle-1.12.262.jar|com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar
    delta-spark_2.12-3.3.0.jar|io/delta/delta-spark_2.12/3.3.0/delta-spark_2.12-3.3.0.jar
    delta-storage-3.3.0.jar|io/delta/delta-storage/3.3.0/delta-storage-3.3.0.jar

services:
  # Одноразовый загрузчик jar'ов: качает только отсутствующие файлы и завершается.
  # command оставлен в compose осознанно — это логика рантайма, а не сборки окружения.
  jar-downloader:
    image: curlimages/curl:latest
    container_name: jar-downloader
    environment:
      <<: *jar-list
    volumes:
      - ./jars:/jars
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /jars || exit 1
        echo "$$JARS" | tr ' ' '\n' | while IFS='|' read -r fname path; do
          [ -z "$$fname" ] && continue
          if [ -f "$$fname" ]; then
            echo "OK: $$fname уже есть, пропускаем"
          else
            echo "Скачиваю $$fname..."
            curl -fsSL --retry 3 -o "$$fname" "https://repo1.maven.org/maven2/$$path" \
              || echo "WARN: не удалось скачать $$fname"
          fi
        done
        echo "jar-downloader завершён"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  spark-master:
    image: apache/spark:3.5.5
    container_name: spark-master
    hostname: spark-master
    depends_on:
      jar-downloader:
        condition: service_completed_successfully
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Master RPC
    volumes:
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-config/core-site.xml:/opt/spark/conf/core-site.xml
      - ./spark-config/spark-env.sh:/opt/spark/conf/spark-env.sh
      # Jar'ы из ./jars — в /opt/spark/extra-jars, чтобы не затереть встроенные jar'ы образа
      - ./jars:/opt/spark/extra-jars:ro

  spark-worker:
    image: apache/spark:3.5.5
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      jar-downloader:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8081:8081"   # Worker UI
    volumes:
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-config/core-site.xml:/opt/spark/conf/core-site.xml
      - ./spark-config/spark-env.sh:/opt/spark/conf/spark-env.sh
      # Jar'ы из ./jars — в /opt/spark/extra-jars, чтобы не затереть встроенные jar'ы образа
      - ./jars:/opt/spark/extra-jars:ro

  # Jupyter: этап "jupyter" из единого multi-stage Dockerfile
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
    image: de-practice-7/jupyter:latest
    container_name: jupyter
    hostname: jupyter
    user: root
    depends_on:
      jar-downloader:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      minio:
        condition: service_started
      spark-master:
        condition: service_started
    working_dir: /home/spark/notebooks
    ports:
      - "8888:8888"   # Jupyter Lab
      - "4040:4040"   # Spark UI приложения (stages/tasks)
    env_file: .env
    volumes:
      - ./notebooks:/home/spark/notebooks
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-config/core-site.xml:/opt/spark/conf/core-site.xml
      - ./spark-config/spark-env.sh:/opt/spark/conf/spark-env.sh
      # Jar'ы из ./jars — в /opt/spark/extra-jars, чтобы не затереть встроенные jar'ы образа
      - ./jars:/opt/spark/extra-jars:ro

  # Виртуальная машина на Ubuntu: этап "ubuntu-vm" из единого multi-stage Dockerfile
  ubuntu-vm:
    build:
      context: .
      dockerfile: Dockerfile
      target: ubuntu-vm
    image: de-practice-7/ubuntu-vm:latest
    container_name: ubuntu-vm
    hostname: ubuntu-vm
    depends_on:
      - postgres
      - minio
      - spark-master
    env_file: .env
    environment:
      # Переменные, которых нет в .env (хосты внутренней сети compose)
      SPARK_CONF_DIR: /opt/spark/conf
    working_dir: /home/student/study
    volumes:
      - ./study:/home/student/study
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-config/core-site.xml:/opt/spark/conf/core-site.xml
      - ./spark-config/spark-env.sh:/opt/spark/conf/spark-env.sh
      # Jar'ы из ./jars — в /opt/spark/extra-jars, чтобы не затереть встроенные jar'ы образа
      - ./jars:/opt/spark/extra-jars:ro

volumes:
  postgres-data:
  minio-data:
