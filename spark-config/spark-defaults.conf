# Общие параметры Spark (Standalone) для мастера и воркера
# Файл должен лежать в ./spark-config как spark-defaults.conf

# Скачаются автоматически из Maven Central при первом запуске spark-shell
# spark.jars.packages org.postgresql:postgresql:42.7.3,org.apache.hadoop:hadoop-aws:3.3.4,io.delta:delta-spark_2.12:3.3.0

# --- Jar'ы, скачанные jar-downloader в ./jars (смонтированы как /opt/spark/extra-jars) ---
spark.jars /opt/spark/extra-jars/postgresql-42.7.3.jar,/opt/spark/extra-jars/hadoop-aws-3.3.4.jar,/opt/spark/extra-jars/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/extra-jars/delta-spark_2.12-3.3.0.jar,/opt/spark/extra-jars/delta-storage-3.3.0.jar

spark.hadoop.fs.s3a.checksum.validation false
spark.hadoop.fs.s3a.change.detection.mode none

spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minioadmin
spark.hadoop.fs.s3a.secret.key minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false

spark.sql.extensions io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog
